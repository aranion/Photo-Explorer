services:
  web:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org/}
        NPM_STRICT_SSL: ${NPM_STRICT_SSL:-false}
    container_name: photo-explorer-web
    ports:
      - '5173:5173'
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      CHOKIDAR_USEPOLLING: 'true'
    command: npm run dev -- --host 0.0.0.0 --port 5173
    healthcheck:
      test: ['CMD', 'wget', '-qO-', 'http://127.0.0.1:5173/']
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
